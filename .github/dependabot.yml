version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "gomod"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      # A release younger than this is not proposed yet (a broken or
      # compromised release is usually pulled within days).
      default-days: 3
      semver-major-days: 14
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
