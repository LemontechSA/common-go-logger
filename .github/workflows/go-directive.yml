name: Go directive

# Kept apart from CI so that adding or removing a label re-runs only this
# check, not the whole build matrix.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-directive:
    # Raising the go or toolchain directive forces every consumer of the
    # module onto a newer Go. A dependency bump must not do it silently: the
    # PR needs the "go-version-bump" label to pass.
    if: "!contains(github.event.pull_request.labels.*.name, 'go-version-bump')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull_request checkout is the merge commit; its first parent is the
      # base commit it was built from, so both go.mod files match even when
      # the job is re-run after the base branch has moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare go and toolchain directives with the base commit
        run: |
          directives() { grep -E '^(go|toolchain)[[:space:]]' || true; }
          base=$(git show HEAD^1:go.mod | directives)
          head=$(directives < go.mod)
          if [ "$base" != "$head" ]; then
            echo "::error file=go.mod::go/toolchain directive changed from '${base//$'\n'/; }' to '${head//$'\n'/; }'. Add the go-version-bump label if this is intended."
            exit 1
          fi
